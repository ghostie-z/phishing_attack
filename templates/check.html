<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Check a URL</title>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .detector-container {
            max-width: 700px;
            margin-top: 5rem;
            padding: 2rem;
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="detector-container">
            <div class="text-center mb-4">
                <h1 class="h3 fw-normal">Check a URL</h1>
                <p class="text-muted">Enter a URL to analyze it for phishing threats.</p>
            </div>

            <form action="/check" method="post">
                <div class="input-group mb-3">
                    <input type="text" class="form-control" name="URL" placeholder="e.g., www.google.com" required>
                    <button class="btn btn-primary" type="submit">Check</button>
                </div>
            </form>

            {% if prediction %}
            <div class="alert {% if prediction == 'Phishing' %}alert-danger{% else %}alert-success{% endif %} mt-4">
                The URL <strong>{{ url }}</strong> is classified as: <strong>{{ prediction }}</strong>
            </div>
            {% endif %}

            {% if error %}
            <div class="alert alert-warning mt-4">
                <strong>Error:</strong> {{ error }}
            </div>
            {% endif %}

            <div class="text-center mt-4">
                <a href="/">Back to Home</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
